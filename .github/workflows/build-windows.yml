name: Збірка Windows .exe

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LastLine-windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30
